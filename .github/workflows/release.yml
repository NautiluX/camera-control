name: Release

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select version when source changed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Stamp release version
        run: python3 .github/scripts/release.py stamp "$VERSION"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - name: Validate without camera hardware
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python3 -m py_compile install.py .github/scripts/release.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build and package
        run: |
          cargo build --release --locked
          test "$(target/release/camera-control --version)" = "Camera Control $VERSION"
          python3 .github/scripts/release.py bundle "$VERSION"
          cd .release
          sha256sum *.tar.gz > "camera-control-v${VERSION}-linux-x86_64.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: .release/*.tar.gz*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x86_64
          path: .release
      - name: Verify download checksum
        working-directory: .release
        run: sha256sum --check *.sha256
      - name: Publish versioned tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish "$VERSION" "$SOURCE"
